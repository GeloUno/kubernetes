---
apiVersion: v1
kind: Namespace
metadata:
  name: task-03

---
apiVersion: v1
kind: Service
metadata:
  name: producer
spec:
  selector:
    app: producer
  ports:
  - port: 8080
    targetPort: 5678

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: task-03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:1.0.0
        args:
        - "-text=Data from producer"
        ports:
        - containerPort: 5678

---
apiVersion: v1
kind: Pod
metadata:
  name: consumer
  namespace: task-03
spec:
  containers:
  - name: consumer
    image: quay.io/curl/curl:8.16.0
    command:
    - "/bin/sh"
    - "-c"
    args:
    - >
      while true; do
        echo "Trying to fetch data from producer...";
        curl -sS producer:8080
        sleep 5;
      done