---
apiVersion: v1
kind: Namespace
metadata:
  name: task-02

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: task-02
data:
  ECHO_TEXT: "Hello from backend"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: task-02
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:1.0.0
        ports:
        - containerPort: 5678
        env:
        - name: ECHO_TEXT
          value: Hello from API

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: task-02
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 5678