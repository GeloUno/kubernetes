---
apiVersion: v1
kind: Namespace
metadata:
  name: task-01

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: task-01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80