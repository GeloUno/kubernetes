apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: backend
  namespace: default
spec:
  selector:
    matchLabels:
      tier: backend
  template:
    metadata:
      labels:
        tier: backend
    spec:
      nodeSelector: 
        topology.kubernetes.io/zone: zone-a
      initContainers:
      - name: sleep
        image: nginx:1.14.2 
        command: ["sleep","2"]
      containers:
      - name: nginx
        image: nginx:1.14.2
       
