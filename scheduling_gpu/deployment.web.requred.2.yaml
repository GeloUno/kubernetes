apiVersion: v1
kind: Namespace
metadata:
  name: required-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-required
  namespace: required-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pod-required
  template:
    metadata:
      labels:
        app: pod-required
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: zone
                operator: In
                values:
                - north
      containers:
      - name: nginx
        image: nginx:1.27