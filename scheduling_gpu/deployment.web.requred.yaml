apiVersion: v1
kind: Namespace
metadata:
  name: mini-scheduler

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: mini-scheduler
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      nodeSelector:
        node-type: web
      containers:
      - name: nginx
        image: nginx:1.27