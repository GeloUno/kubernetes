# project 1
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: gk-1
  labels:
    name: backend
    company: GK
    type: backend
    project: "1"
spec:
  containers:
  - name: nginx
    image: nginx:1.25.2
    ports:
      - containerPort: 80

---

apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: gk-1
  labels:
    name: frontend
    company: GK
    type: frontend
    project: "1"
spec:
  containers:
  - name: nginx
    image: nginx:1.25.2
    ports:
      - containerPort: 80
        
