apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gk-web-argocd-helm
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@gitlab.com:geloke59/argocd.git
    targetRevision: master
    path: helm/gk-web

    helm:
      valueFiles:
        - values.test.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: ns-gk-22-argo-helm
    
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
      enabled: false
    syncOptions:
      - CreateNamespace=true