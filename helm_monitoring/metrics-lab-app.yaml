apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-lab-app
  namespace: gk-21-app
data:
  app.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import time

    requests = {}
    duration_buckets = {
        0.1: 0,
        0.5: 0,
        1.0: 0,
        2.5: 0,
        5.0: 0,
        float("inf"): 0,
    }
    duration_sum = 0.0
    duration_count = 0

    def record_request(path, status, duration):
        global duration_sum, duration_count

        key = (path, status)
        requests[key] = requests.get(key, 0) + 1

        duration_sum += duration
        duration_count += 1

        for boundary in duration_buckets:
            if duration <= boundary:
                duration_buckets[boundary] += 1

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics":
                self.send_metrics()
                return

            start = time.time()

            if self.path == "/error":
                status = 500
                body = b"Internal Server Error\n"

            elif self.path == "/slow":
                time.sleep(2)
                status = 200
                body = b"Slow response\n"

            else:
                status = 200
                body = b"OK\n"

            duration = time.time() - start
            record_request(self.path, str(status), duration)

            self.send_response(status)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(body)

        def send_metrics(self):
            lines = [
                "# HELP lab_http_requests_total Total number of HTTP requests",
                "# TYPE lab_http_requests_total counter",
            ]

            for (path, status), value in sorted(requests.items()):
                lines.append(
                    f'lab_http_requests_total{{path="{path}",status="{status}"}} {value}'
                )

            lines.extend([
                "# HELP lab_http_request_duration_seconds HTTP request duration",
                "# TYPE lab_http_request_duration_seconds histogram",
            ])

            for boundary, value in duration_buckets.items():
                label = "+Inf" if boundary == float("inf") else str(boundary)
                lines.append(
                    f'lab_http_request_duration_seconds_bucket{{le="{label}"}} {value}'
                )

            lines.append(
                f"lab_http_request_duration_seconds_sum {duration_sum}"
            )
            lines.append(
                f"lab_http_request_duration_seconds_count {duration_count}"
            )

            body = ("\n".join(lines) + "\n").encode()

            self.send_response(200)
            self.send_header(
                "Content-Type",
                "text/plain; version=0.0.4"
            )
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, format, *args):
            return

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-lab-app
  namespace: gk-21-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-lab-app
  template:
    metadata:
      labels:
        app: metrics-lab-app
    spec:
      containers:
        - name: metrics-lab-app
          image: python:3.13-alpine
          command:
            - python
            - /app/app.py
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: metrics-lab-app

---
apiVersion: v1
kind: Service
metadata:
  name: metrics-lab-app
  namespace: gk-21-app
  labels:
    app: metrics-lab-app
spec:
  selector:
    app: metrics-lab-app
  ports:
    - name: metrics
      port: 8080
      targetPort: http

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: metrics-lab-app
  namespace: gk-21-app
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: metrics-lab-app
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
---
