apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-example-app
  namespace: gk-21-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prometheus-example-app
  template:
    metadata:
      labels:
        app: prometheus-example-app
    spec:
      containers:
        - name: prometheus-example-app
          image: quay.io/brancz/prometheus-example-app:v0.5.0
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

---

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-example-app
  namespace: gk-21-app
  labels:
    app: prometheus-example-app
spec:
  selector:
    app: prometheus-example-app
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP

---

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus-example-app
  namespace: gk-21-app
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: prometheus-example-app
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s

---

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prometheus-example-app
  namespace: gk-21-app
  labels:
    release: monitoring
spec:
  groups:
    - name: prometheus-example-app.rules
      rules:
        - alert: PrometheusExampleAppDown
          expr: up{job="prometheus-example-app"} == 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus example app is unavailable"
            description: "Target {{ $labels.instance }} has been unavailable for more than 1 minute."