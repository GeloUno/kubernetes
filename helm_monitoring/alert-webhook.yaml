apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-webhook-script
  namespace: gk-21-app
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class WebhookHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            content_length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(content_length)

            print("\n=== ALERTMANAGER WEBHOOK ===", flush=True)
            print(f"Path: {self.path}", flush=True)

            try:
                payload = json.loads(body)
                print(json.dumps(payload, indent=2), flush=True)
            except json.JSONDecodeError:
                print(body.decode("utf-8", errors="replace"), flush=True)

            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"alert received\n")

        def do_GET(self):
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"webhook receiver ready\n")

        def log_message(self, format, *args):
            print(f"HTTP: {format % args}", flush=True)

    server = HTTPServer(("0.0.0.0", 8080), WebhookHandler)
    print("Webhook receiver listening on port 8080", flush=True)
    server.serve_forever()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  namespace: gk-21-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-webhook
  template:
    metadata:
      labels:
        app: alert-webhook
    spec:
      containers:
        - name: webhook
          image: python:3.13-alpine
          command:
            - python
            - /app/server.py
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: alert-webhook-script

---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
  namespace: gk-21-app
spec:
  selector:
    app: alert-webhook
  ports:
    - name: http
      port: 8080
      targetPort: http