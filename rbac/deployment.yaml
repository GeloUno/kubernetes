apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gk-11-requester
  name: gk-11-requester
  namespace: gk-11-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gk-11-requester
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: gk-11-requester
    spec:
      serviceAccountName: gk-11-sa
      containers:
      - image: quay.io/curl/curl:8.16.0
        name: requester
        command: 
        - sleep
        - "3600"


