---
apiVersion: v1
kind: Namespace
metadata:
  name: php-apache

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: php-apache-quota
  namespace: php-apache
spec:
  hard:
    cpu: "1000m"
    limits.cpu: "1000m"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: php-apache-limit-range
  namespace: php-apache
spec:
  limits:
    - type: Container
      max:
        cpu: 250m
      default:
        cpu: 150m

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  namespace: php-apache
spec:
  replicas: 1
  selector:
    matchLabels:
      run: php-apache
  template:
    metadata:
      labels:
        run: php-apache
    spec:
      containers:
      - name: php-apache
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 250m
          requests:
            cpu: 100m

---
apiVersion: v1
kind: Service
metadata:
  name: php-apache
  namespace: php-apache
spec:
  ports:
  - port: 80
  selector:
    run: php-apache

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache
  namespace: php-apache
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 0
    scaleUp:
      stabilizationWindowSeconds: 0