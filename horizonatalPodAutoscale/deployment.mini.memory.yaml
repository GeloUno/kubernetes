apiVersion: v1
kind: Namespace
metadata:
  name: mini-memory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-burn
  namespace: mini-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-burn
  template:
    metadata:
      labels:
        app: memory-burn
    spec:
      containers:
      - name: memory
        image: python:3.12-alpine
        command:
        - python
        - -c
        - |
          x = []
          while True:
              x.append(" " * 1024 * 1024)
        resources:
          requests:
            memory: "16Mi"
          limits:
            memory: "32Mi"